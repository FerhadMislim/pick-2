name: Run Python Script

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year for the script'
        required: true
        default: '2022'
      single_year:
        description: 'Scrape only single year'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Run scraper
      run: |
        if [ "${{ github.event.inputs.single_year }}" = "true" ]; then
          python scrape_pick2.py ${{ github.event.inputs.year }} --single-year
        else
          python scrape_pick2.py ${{ github.event.inputs.year }}
        fi

    - name: Commit and push changes
      run: |
        git config --global user.email "<>"
        git config --global user.name "github-bot"
        if [ "${{ github.event.inputs.single_year }}" = "true" ]; then
          git checkout -b data-${{ github.event.inputs.year }}
          git add .
          git commit -m "Update CSV for year ${{ github.event.inputs.year }}"
          git push origin data-${{ github.event.inputs.year }}
        else
          git checkout -b data-all
          git add .
          git commit -m "Update CSV for year ${{ github.event.inputs.year }} onwards"
          git push origin data-all
        fi
